<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conta Vytal</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/ecg/vytal-ecg-logo.png">
<meta name="theme-color" content="#111726">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#111726;--navy-2:#1f2740;--rose:#A9525A;--bg:#FAFBFC;--ink:#1a1f2e;--mute:#5c6274;--line:#e3e6ec;--ok:#136F52;--ok-bg:#ECF7F1;--erro:#A12C2C;--erro-bg:#FBE9E9}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
header{border-bottom:1px solid var(--line);background:#fff}
.nav{width:min(560px,calc(100% - 32px));margin:0 auto;height:64px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;font-weight:700;color:var(--navy)}
.brand img{height:30px}
main{width:min(560px,calc(100% - 32px));margin:0 auto;padding-block:40px 72px}
.caixa{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.02em;line-height:1.15}
p{margin:10px 0 0;color:var(--mute)}
form{display:grid;gap:12px;margin-top:18px}
label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;font-weight:600;color:var(--navy)}
input{font:inherit;font-weight:400;padding:.7rem .8rem;border:1px solid #cfd4dd;border-radius:10px}
input:focus-visible,button:focus-visible{outline:3px solid var(--rose);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:.9rem 1.4rem;background:var(--navy);color:#fff;cursor:pointer;justify-self:start}
button:hover{background:var(--navy-2)}
button[disabled]{opacity:.55;cursor:progress}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:.94rem}
.msg.erro{background:var(--erro-bg);color:var(--erro)}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.icone{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;margin-bottom:14px}
.icone.ok{background:var(--ok-bg);color:var(--ok)}
.icone.erro{background:var(--erro-bg);color:var(--erro)}
</style>
</head>
<body>
<header><div class="nav"><a class="brand" href="/ecg"><img src="/ecg/vytal-ecg-logo.png" alt=""> Vytal ECG</a></div></header>
<main>
  <!-- resultado da confirmação de e-mail (?email=ok|ja-confirmado|expirado|invalido) -->
  <section class="caixa" id="confirmacao" hidden>
    <div class="icone" id="conf-icone"></div>
    <h1 id="conf-titulo"></h1>
    <p id="conf-texto"></p>
  </section>

  <!-- nova senha (?senha=token) -->
  <section class="caixa" id="nova-senha" hidden>
    <h1>Crie uma nova senha</h1>
    <p>Use pelo menos 8 caracteres.</p>
    <form id="form-nova" novalidate>
      <label>Nova senha<input type="password" id="senha1" autocomplete="new-password" minlength="8" required></label>
      <label>Repita a nova senha<input type="password" id="senha2" autocomplete="new-password" minlength="8" required></label>
      <button type="submit" id="btn-nova">Salvar senha</button>
    </form>
    <div id="msg-nova" class="msg erro" hidden role="alert"></div>
  </section>

  <!-- pedir o link (sem parâmetros) -->
  <section class="caixa" id="esqueci" hidden>
    <h1>Esqueci minha senha</h1>
    <p>Informe o e-mail da sua conta Vytal. Enviamos um link para criar uma nova senha.</p>
    <form id="form-esqueci" novalidate>
      <label>E-mail<input type="email" id="email" autocomplete="username" required></label>
      <button type="submit" id="btn-esqueci">Enviar link</button>
    </form>
    <div id="msg-esqueci" class="msg" hidden role="status"></div>
  </section>
</main>
<script>
(() => {
  const API = "https://vytal-api-production.up.railway.app";
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const mostrar = (el, texto, tipo) => { el.textContent = texto; el.className = "msg " + tipo; el.hidden = !texto; };

  const conf = q.get("email");
  const token = q.get("senha");
  if (conf) {
    const casos = {
      "ok": ["ok", "✓", "E-mail confirmado", "Pronto. Volte ao app Vytal ECG e toque em Verificar meu acesso."],
      "ja-confirmado": ["ok", "✓", "E-mail já confirmado", "Sua conta já estava confirmada. Pode voltar ao app."],
      "expirado": ["erro", "!", "Link expirado", "Abra o app Vytal ECG e peça um novo e-mail de confirmação."],
      "invalido": ["erro", "!", "Link inválido ou já usado", "Se o e-mail ainda não foi confirmado, peça um novo link no app."],
    };
    const [tipo, icone, titulo, texto] = casos[conf] || casos.invalido;
    $("conf-icone").className = "icone " + tipo; $("conf-icone").textContent = icone;
    $("conf-titulo").textContent = titulo; $("conf-texto").textContent = texto;
    $("confirmacao").hidden = false;
    history.replaceState(null, "", location.pathname);
  } else if (token) {
    $("nova-senha").hidden = false;
    // o token sai da barra de endereço (histórico, prints, compartilhamento)
    history.replaceState(null, "", location.pathname);
    $("form-nova").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const s1 = $("senha1").value, s2 = $("senha2").value;
      if (s1.length < 8) return mostrar($("msg-nova"), "A senha precisa ter pelo menos 8 caracteres.", "erro");
      if (s1 !== s2) return mostrar($("msg-nova"), "As duas senhas não são iguais.", "erro");
      $("btn-nova").disabled = true;
      try {
        const r = await fetch(API + "/estudante/auth/senha/redefinir", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, novaSenha: s1 }) });
        const c = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(r.status === 410 ? "Este link expirou. Peça um novo abaixo." : (Array.isArray(c.message) ? c.message[0] : c.message) || "Não deu certo. Tente de novo.");
        $("form-nova").hidden = true;
        mostrar($("msg-nova"), "Senha alterada. Entre no app Vytal ECG com a nova senha.", "ok");
      } catch (e) {
        mostrar($("msg-nova"), e.message, "erro");
        if (/expirou/.test(e.message)) $("esqueci").hidden = false;
      } finally { $("btn-nova").disabled = false; $("senha1").value = ""; $("senha2").value = ""; }
    });
  } else {
    $("esqueci").hidden = false;
  }

  $("form-esqueci").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const email = $("email").value.trim();
    if (!/^\S+@\S+\.\S+$/.test(email)) return mostrar($("msg-esqueci"), "Informe um e-mail válido.", "erro");
    $("btn-esqueci").disabled = true;
    try {
      await fetch(API + "/estudante/auth/senha/esqueci", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
      mostrar($("msg-esqueci"), "Se houver uma conta com este e-mail, o link chega em alguns minutos. Confira também o spam.", "ok");
    } catch (e) {
      mostrar($("msg-esqueci"), "Sem conexão. Tente de novo.", "erro");
    } finally { $("btn-esqueci").disabled = false; }
  });
})();
</script>
</body>
</html>
