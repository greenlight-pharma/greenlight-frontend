<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>WMed · estúdio de resumos</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url(node_modules/@fontsource/permanent-marker/files/permanent-marker-latin-400-normal.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Shantell Sans"; font-weight: 800; src: url(node_modules/@fontsource/shantell-sans/files/shantell-sans-latin-800-normal.woff2) format("woff2"); font-display: block; }
  @font-face { font-family: "Shantell Sans"; font-weight: 800; src: url(node_modules/@fontsource/shantell-sans/files/shantell-sans-latin-ext-800-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; font-display: block; }
  @font-face { font-family: "Shantell Sans"; font-weight: 700; src: url(node_modules/@fontsource/shantell-sans/files/shantell-sans-latin-700-normal.woff2) format("woff2"); font-display: block; }
  html, body { margin: 0; background: #0b171e; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F5EFE2; }
  .p5Canvas, canvas.p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="90" step="0.0333" value="0"><span id="tt">carregando…</span></div>
</main>
<script src="src/core.js"></script>
<script src="src/cast.js"></script>
<script src="src/kit.js"></script>
<script src="src/timeline.js"></script>
<script>
  // ?topic=<arquivo em topics/, sem .js>
  const TOPIC = new URLSearchParams(location.search).get('topic') || 'insuficiencia-cardiaca';
  if (!/^[a-z0-9-]+$/.test(TOPIC)) throw new Error('tema inválido');
  document.write('<script src="topics/' + TOPIC + '.js"><\/script>');
</script>
</body>
</html>
