<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2Doctor · app motion</title>
<style>
  @font-face { font-family: 'Jakarta'; src: url('../../../wmed-app/public/fonts/PlusJakartaSans-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Jakarta'; src: url('../../../wmed-app/public/fonts/PlusJakartaSans-SemiBold.ttf'); font-weight: 600; }
  :root {
    --teal: #265B5A; --teal-2: #2F6E6B; --teal-soft: #E3EFEE; --ink: #1A2C3E; --grey: #64737B;
    --bg: #F5F8F7; --line: #DCE5E3; --warn: #B4642D; --gold: #E9B872;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: #0B151B; font-family: 'Jakarta', system-ui, sans-serif; color: var(--ink); }
  #stage { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 30% 20%, #16303a 0%, #0B151B 60%); }
  #glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(38,91,90,.45), rgba(38,91,90,0) 65%); filter: blur(10px); }
  #cam { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
  #win { position: absolute; left: 140px; top: 70px; width: 1000px; height: 580px; background: var(--bg); border-radius: 22px;
         box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); overflow: hidden; transform-style: preserve-3d; }
  .top { height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 24px; background: #fff; border-bottom: 1px solid var(--line); }
  .top img { height: 26px; }
  .top b { font-weight: 600; font-size: 17px; letter-spacing: -.2px; }
  .top .pill { margin-left: auto; font-size: 12px; color: var(--teal); background: var(--teal-soft); padding: 6px 12px; border-radius: 99px; font-weight: 600; }
  .search { margin: 22px 28px 0; height: 54px; border-radius: 14px; background: #fff; border: 1.5px solid var(--line); display: flex; align-items: center; padding: 0 18px; gap: 12px; font-size: 18px; }
  .search.on { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(38,91,90,.12); }
  .search .mag { width: 18px; height: 18px; border: 2.5px solid var(--grey); border-radius: 50%; position: relative; flex: none; }
  .search .mag::after { content: ''; position: absolute; width: 8px; height: 2.5px; background: var(--grey); right: -7px; bottom: -3px; transform: rotate(45deg); }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--teal); vertical-align: -4px; margin-left: 2px; }
  .ph { color: #9AA7AD; }
  .status { margin: 16px 28px 0; font-size: 13px; color: var(--grey); display: flex; gap: 8px; align-items: center; height: 26px; }
  .chip { font-size: 12px; font-weight: 600; color: var(--teal); background: var(--teal-soft); border-radius: 99px; padding: 5px 11px; white-space: nowrap; }
  .chip.src { background: #fff; border: 1px solid var(--line); color: var(--ink); }
  .bar { height: 3px; background: var(--line); margin: 10px 28px 0; border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--teal); }
  #cards { position: absolute; left: 28px; right: 28px; top: 196px; bottom: 20px; }
  .card { position: absolute; background: #fff; border-radius: 16px; border: 1px solid var(--line); padding: 18px 20px; box-shadow: 0 8px 26px rgba(26,44,62,.07); }
  .card h3 { font-size: 21px; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .card h3 .n { width: 30px; height: 30px; border-radius: 9px; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 16px; }
  .row { display: flex; gap: 12px; align-items: baseline; font-size: 19px; line-height: 1.35; margin: 11px 0; }
  .row .tick { flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--teal); position: relative; top: 2px; }
  .row .tick::after { content: ''; position: absolute; left: 5px; top: 3px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .row b { font-weight: 600; }
  .cite { font-size: 13px; color: var(--grey); margin-top: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 17px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--grey); font-weight: 600; padding: 4px 8px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 9px 8px; border-bottom: 1px solid #EEF3F2; vertical-align: top; }
  td b { font-weight: 600; }
  .hl { background: #FFF6E8; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-size: 15px; line-height: 1.35; }
  .tile h4 { font-size: 18px; font-weight: 600; color: var(--teal); margin-bottom: 6px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lane { border-radius: 12px; padding: 14px 16px; font-size: 17px; line-height: 1.4; }
  .lane h4 { font-size: 14px; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
  .lane.st { background: #FBEDEA; } .lane.st h4 { color: #A3392B; }
  .lane.ns { background: var(--teal-soft); } .lane.ns h4 { color: var(--teal); }
  .gauge { height: 10px; border-radius: 6px; background: linear-gradient(90deg, #6BAF8C 0 30%, #E9B872 30% 70%, #D9695B 70%); position: relative; margin: 8px 0 4px; }
  .gauge i { position: absolute; top: -4px; width: 4px; height: 18px; background: var(--ink); border-radius: 2px; }
  #cap { position: absolute; left: 60px; bottom: 34px; font-size: 13px; letter-spacing: 2px; color: rgba(237,230,218,.75); text-transform: uppercase; }
</style>
</head>
<body>
<div id="stage"><div id="glow"></div>
  <div id="cam">
    <div id="win">
      <div class="top"><img src="../2d-mark.png" alt=""><b>2Doctor</b><span class="pill">Guideline search</span></div>
      <div class="search" id="search"><span class="mag"></span><span id="q"></span></div>
      <div class="status" id="status"></div>
      <div class="bar"><i id="prog" style="width:0"></i></div>
      <div id="cards"></div>
    </div>
  </div>
  <div id="cap"></div>
</div>
<script src="conteudo.js"></script>
<script>
// Cada quadro é função pura do tempo t (s): render(t) monta o estado inteiro, sem transições CSS.
const C = window.CONTEUDO;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

// Linha do tempo: busca, depois um cartão por vez com a câmera indo até ele.
const T = C.tempos;             // {digitar, buscar, cartoes:[duração de cada], fontes}
const inicioCartao = []; { let x = T.digitar + T.buscar; for (const d of T.cartoes) { inicioCartao.push(x); x += d; } }
const fim = inicioCartao.at(-1) + T.cartoes.at(-1) + T.fontes;

function revela(i, lt, passo = .45, atraso = .5) { return ease((lt - atraso - i * passo) / .45); }
function estiloEntrada(k, dy = 14) { return `opacity:${k};transform:translateY(${(1 - k) * dy}px)`; }

function cartaoHTML(c, lt) {
  const r = (i, html) => `<div style="${estiloEntrada(revela(i, lt, c.passo || .6))}">${html}</div>`;
  let corpo = '';
  if (c.tipo === 'lista') corpo = c.itens.map((it, i) => r(i, `<div class="row"><span class="tick"></span><span>${it}</span></div>`)).join('');
  if (c.tipo === 'duas') corpo = `<div class="split">${c.colunas.map((col, i) => r(i, `<div class="lane ${col.classe}"><h4>${col.titulo}</h4>${col.linhas.map(l => `<div>${l}</div>`).join('')}</div>`)).join('')}</div>`;
  if (c.tipo === 'tabela') corpo = `<table><tr>${c.cab.map(h => `<th>${h}</th>`).join('')}</tr>${c.linhas.map((l, i) => {
      const k = revela(i, lt, c.passo || .8); return `<tr class="${l.destaque && lt > c.destaqueEm ? 'hl' : ''}" style="opacity:${k}">${l.celulas.map(x => `<td>${x}</td>`).join('')}</tr>`; }).join('')}</table>`;
  if (c.tipo === 'escores') corpo = `<div class="tiles">${c.itens.map((e, i) => r(i, `<div class="tile"><h4>${e.nome}</h4><div>${e.texto}</div>${e.gauge ? `<div class="gauge"><i style="left:${4 + 90 * ease((lt - 2 - i * 1.2) / 2.5) * e.gauge}%"></i></div><div style="font-size:11px;color:#64737B">${e.faixas}</div>` : ''}</div>`)).join('')}</div>`;
  const nota = c.nota ? `<div style="${estiloEntrada(ease((lt - c.notaEm) / .5))};margin-top:8px;font-size:13px;color:#8A4B1F">${c.nota}</div>` : '';
  return `<h3><span class="n">${c.num}</span>${c.titulo}</h3>${corpo}${nota}<div class="cite">${c.fonte}</div>`;
}

function render(t) {
  // fundo e brilho andando devagar
  $('glow').style.left = (-200 + 60 * Math.sin(t / 7)) + 'px'; $('glow').style.top = (-300 + 40 * Math.cos(t / 9)) + 'px';

  // janela entra inclinada e assenta
  const e = ease(t / 1.6);
  $('win').style.transform = `perspective(1400px) translateY(${(1 - e) * 60}px) rotateX(${(1 - e) * 14}deg) rotateY(${(1 - e) * -10}deg)`;
  $('win').style.opacity = e;

  // digitação da pergunta
  const td = clamp((t - 1.4) / (T.digitar - 2.0));
  const n = Math.floor(C.pergunta.length * td);
  const piscar = Math.floor(t * 2) % 2 === 0;
  $('q').innerHTML = n === 0 && t < 1.6 ? `<span class="ph">Ask a clinical question…</span>` : esc(C.pergunta.slice(0, n)) + (t < T.digitar + .3 && piscar ? '<span class="caret"></span>' : '');
  $('search').className = 'search' + (t > 1.2 ? ' on' : '');

  // busca: fontes aparecem e barra enche
  const tb = t - T.digitar;
  $('prog').style.width = (100 * ease(tb / T.buscar)) + '%';
  $('status').innerHTML = tb < 0 ? '' : (tb < T.buscar ? '<span>Searching guidelines…</span>' : '<span class="chip">Answer ready</span>') +
    C.fontesBusca.map((f, i) => `<span class="chip src" style="opacity:${ease((tb - .3 - i * .35) / .4)}">${f}</span>`).join('');

  // cartões: cada um ocupa a área; o anterior sobe e some
  let html = '', alvo = null;
  C.cartoes.forEach((c, i) => {
    const lt = t - inicioCartao[i];
    if (lt < -0.2 || lt > T.cartoes[i] + 0.6) return;
    const kin = ease(lt / .6), kout = ease((lt - T.cartoes[i]) / .6);
    html += `<div class="card" style="left:0;right:0;top:0;opacity:${kin * (1 - kout)};transform:translateY(${(1 - kin) * 40 - kout * 40}px)">${cartaoHTML(c, lt)}</div>`;
    if (lt >= 0 && lt <= T.cartoes[i]) alvo = { i, lt };
  });
  $('cards').innerHTML = html;

  // câmera: aproxima do cartão ativo e deriva devagar (motion)
  let z = 1, x = 0, y = 0;
  if (alvo) {
    const k = ease(alvo.lt / 1.2) * (1 - ease((alvo.lt - T.cartoes[alvo.i] + .8) / .8));
    z = 1 + .22 * k; x = -150 * k + 12 * Math.sin(t / 2.3); y = -215 * k + 8 * Math.cos(t / 2.9);
  } else if (t > T.digitar - 1 && t < T.digitar + T.buscar) { const k = ease((t - T.digitar + 1) / 1.5); z = 1 + .08 * k; x = -40 * k; y = -20 * k; }
  $('cam').style.transform = `translate(${x}px, ${y}px) scale(${z})`;

  // legenda discreta embaixo
  const ativo = alvo ? C.cartoes[alvo.i].legenda : (t < T.digitar ? 'Asking 2Doctor' : '');
  $('cap').textContent = ativo || '';
  $('cap').style.opacity = ativo ? .75 : 0;

  // fontes no fim
  if (t > fim - T.fontes) {
    const k = ease((t - (fim - T.fontes)) / .6);
    $('cards').innerHTML = `<div class="card" style="left:0;right:0;top:0;opacity:${k}"><h3><span class="n">✓</span>Sources</h3>${C.fontesFinais.map((f, i) =>
      `<div class="row" style="${estiloEntrada(ease((t - (fim - T.fontes) - .4 - i * .3) / .4))}"><span>${f}</span></div>`).join('')}<div class="cite">${C.aviso}</div></div>`;
  }
  return fim;
}
window.render = render;
window.duracao = fim;
render(0);
</script>
</body>
</html>
